services:
  - type: web
    name: inventario-upq
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /var/data/inventario.sqlite
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: inventario-upq-data
      mountPath: /var/data
      sizeGB: 1
